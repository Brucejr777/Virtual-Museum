<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf7f2" />
    <meta
      name="description"
      content="The Meridian Archive is a virtual museum for the objects, ideas, and makers that shaped our shared imagination."
    />
    <meta property="og:title" content="The Meridian Archive — A Virtual Museum" />
    <meta
      property="og:description"
      content="A borderless museum for the objects, ideas, and makers that shaped our shared imagination."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://commons.wikimedia.org" />
    <link rel="dns-prefetch" href="https://upload.wikimedia.org" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap"
    />
    <title>The Meridian Archive — A Virtual Museum</title>
    <script>
      // Apply theme before first paint to avoid flash.
      (function () {
        try {
          var stored = localStorage.getItem('meridian-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#121110' : '#faf7f2');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui;">
        The Meridian Archive requires JavaScript to display the virtual museum.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
